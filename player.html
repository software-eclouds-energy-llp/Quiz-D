<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<meta name="theme-color" content="#17092E">
<title>Join — AI &amp; LLM Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="webview-fit.js"></script>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="wrap">
  <div class="card" id="card"></div>
  <div class="foot-note" id="footnote">Player</div>
</div>

<!-- Persistent connection badge (Alpine) — survives the innerJoin/question re-renders below,
     since it lives outside #card and just watches the browser's online/offline events. -->
<div class="toast" style="position:fixed;top:max(14px, env(safe-area-inset-top));left:50%;bottom:auto;transform:translateX(-50%);background:transparent;box-shadow:none;padding:0;z-index:60;"
     x-data="{ online: navigator.onLine }"
     x-init="window.addEventListener('online', () => online = true); window.addEventListener('offline', () => online = false);">
  <span class="conn-badge" :class="online ? 'is-online' : 'is-offline'" x-show="!online" x-cloak>
    <span class="dot"></span>
    <span x-text="online ? 'Connected' : 'Offline — reconnecting…'"></span>
  </span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
<script src="firebase-init.js"></script>
<script>
const SHAPES = [
  { key: "A", cls: "shape-a", glyph: "▲" },
  { key: "B", cls: "shape-b", glyph: "◆" },
  { key: "C", cls: "shape-c", glyph: "●" },
  { key: "D", cls: "shape-d", glyph: "■" },
];

const card = document.getElementById("card");
const footnote = document.getElementById("footnote");

const playerId = "p_" + Math.random().toString(36).slice(2, 10);

let roomCode = null;
let roomRef = null;
let playersRef = null;
let answersRef = null;
let myName = "";
let lastRenderedKey = null; // `${status}:${qIndex}` — avoids redundant re-renders
let myQ = 0;              // self-paced: which question THIS player is on
let selfStarted = false;  // guard so the self-paced run only kicks off once
let finishedSelf = false; // this player has answered their last question
const SELF_FEEDBACK_SECONDS = 3; // how long the result screen holds before auto-advancing
let qStartedAtLocal = null;
let hasAnsweredThisQ = false;
let feedbackShown = false; // guards against showing feedback twice (instant local vs. host's broadcast reveal)
let localTimer = null;
let myScore = 0;
let streak = 0; // fun element: consecutive correct answers
let liveCountRef = null; // Firebase listener on this question's answers (live count on feedback screen)
let scoresListenerRef = null; // live standings listener on the feedback screen
let reactionsRef = null; // per-room emoji reactions feed
let feedbackTimer = null; // countdown interval on feedback screen
let myPrevRank = null; // my rank after the previous question, for the "you moved up" delta
let myLiveRank = null; // my most recent live rank, settled into myPrevRank on advance
const _prefilledCode = (new URLSearchParams(location.search).get("code") || "").replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(0, 4);

/* ---------- Sound effects (Web Audio, no library) ---------- */
// AudioContext must be created/resumed from a user gesture, so we lazy-init on
// the first join tap. All effects are synthesized — no audio files to ship.
let _audioCtx = null;
let soundOn = true;
function initAudio() {
  if (_audioCtx) { if (_audioCtx.state === "suspended") _audioCtx.resume(); return; }
  try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { _audioCtx = null; }
}
// Play a tone: freq(s) can be a single Hz or [from,to] for a glide.
function tone(freq, dur, type = "sine", gain = 0.15) {
  if (!soundOn || !_audioCtx) return;
  const t0 = _audioCtx.currentTime;
  const osc = _audioCtx.createOscillator();
  const g = _audioCtx.createGain();
  osc.type = type;
  if (Array.isArray(freq)) {
    osc.frequency.setValueAtTime(freq[0], t0);
    osc.frequency.exponentialRampToValueAtTime(freq[1], t0 + dur);
  } else {
    osc.frequency.setValueAtTime(freq, t0);
  }
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(_audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function playCorrect() { tone([660, 990], 0.18, "sine", 0.18); setTimeout(() => tone(1320, 0.16, "sine", 0.14), 90); }
function playWrong() { tone([300, 120], 0.32, "sawtooth", 0.16); }
function playBeep() { tone(880, 0.08, "square", 0.10); }

// Questions + timing come from the room itself now (the host picks the quiz
// set on their setup screen and embeds it in the room), not a local file —
// this is what lets the host run any quiz built in the admin console.
let quizQuestions = [];
let quizSeconds = 20;

function esc(str) {
  const d = document.createElement("div");
  d.textContent = String(str);
  return d.innerHTML;
}

function animateCardIn() {
  if (window.anime) {
    anime({ targets: "#card", opacity: [0, 1], translateY: [16, 0], duration: 420, easing: "easeOutQuad" });
  }
}

/* ---------- Podium: special banners for the top 3 finishers ---------- */
// Mirrors the same helpers in host.html. Reveal order is bronze → silver
// → gold; Alpine (x-data/x-show/x-transition below) owns the reveal
// timing/visibility, animatePodium() layers anime.js flourishes on top.
const PODIUM_DELAYS = { 1: [150], 2: [150, 650], 3: [150, 550, 1000] };

function podiumHTML(list, myId) {
  const top = list.slice(0, 3);
  if (!top.length) return "";
  const medal = ["🥇", "🥈", "🥉"];
  const cls = ["podium-gold", "podium-silver", "podium-bronze"];
  const revealOrder = top.length === 3 ? [2, 1, 0] : top.length === 2 ? [1, 0] : [0];
  const delays = PODIUM_DELAYS[top.length];
  const revealInit = revealOrder.map((rankIdx, seq) => `setTimeout(() => r[${rankIdx}]=true, ${delays[seq]})`).join("; ");

  const cards = top.map((p, i) => `
    <div class="podium-card ${cls[i]} ${myId && p.id === myId ? "me" : ""}" x-show="r[${i}]" x-cloak
         x-transition:enter="pod-enter" x-transition:enter-start="pod-enter-start" x-transition:enter-end="pod-enter-end">
      ${i === 0 ? `<span class="podium-crown">👑</span>` : ""}
      <span class="podium-medal">${medal[i]}</span>
      <span class="podium-name">${esc(p.name)}${myId && p.id === myId ? " (you)" : ""}</span>
      <span class="podium-score">${p.score} pts</span>
    </div>`).join("");

  return `<div class="podium" x-data="{ r: [false,false,false] }" x-init="${revealInit}">${cards}</div>`;
}

function podiumConfettiDelay(n) {
  return n >= 3 ? 1150 : n === 2 ? 800 : n === 1 ? 350 : 0;
}

function animatePodium(n) {
  if (!window.anime || !n) return;
  const goldDelay = PODIUM_DELAYS[n][PODIUM_DELAYS[n].length - 1];
  anime({ targets: ".podium-crown", rotate: [-14, 12, -6, 0], duration: 700, delay: goldDelay + 380, easing: "easeInOutSine" });
  anime({ targets: ".podium-gold .podium-score", scale: [1, 1.18, 1], duration: 420, delay: goldDelay + 380, easing: "easeOutQuad" });
}

/* ---------- Join screen ---------- */

function renderJoin(errorMsg) {
  footnote.textContent = "Join a live game";
  card.innerHTML = `
    <div x-data="{ code: '${_prefilledCode}', name: '' }">
      <span class="on-air"><span class="dot"></span>Live game</span>
      <h1 style="margin-top:14px;">Join the Quiz</h1>
      <p class="lead">Enter the room code from the host's screen and pick a name.</p>
      <label for="codeInput">Room code</label>
      <input type="text" id="codeInput" class="code-input" maxlength="4" placeholder="XXXX" autocomplete="off"
        inputmode="text" autocapitalize="characters"
        x-model="code" x-on:input="code = code.toUpperCase().slice(0, 4)" />
      <label for="nameInput" style="margin-top:16px;">Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Priya" maxlength="24" autocomplete="off"
        x-model="name" />
      <p class="hint" style="text-align:right;margin-top:6px;" x-text="name.length + '/24'"></p>
      <button class="btn btn-primary" id="joinBtn" :disabled="code.length !== 4 || !name.trim()">Join Game</button>
      <p class="error-text">${errorMsg ? esc(errorMsg) : ""}</p>
    </div>
  `;
  animateCardIn();
  const codeInput = document.getElementById("codeInput");
  const nameInput = document.getElementById("nameInput");
  const joinBtn = document.getElementById("joinBtn");
  if (codeInput.value.length === 4) nameInput.focus(); else codeInput.focus();
  [codeInput, nameInput].forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" && !joinBtn.disabled) joinBtn.click(); });
  });
  joinBtn.addEventListener("click", () => { initAudio(); attemptJoin(codeInput.value, nameInput.value); });
}

async function attemptJoin(codeRaw, nameRaw) {
  const code = codeRaw.trim().toUpperCase();
  const name = nameRaw.trim().slice(0, 24);
  if (code.length !== 4) return renderJoin("Enter the 4-character room code.");
  if (!name) return renderJoin("Enter your name.");

  const candidateRoomRef = db.ref("rooms/" + code);
  let snap;
  try {
    snap = await candidateRoomRef.once("value");
  } catch (e) {
    return renderJoin("Couldn't reach the game server. Check your connection.");
  }
  const room = snap.val();
  if (!room) return renderJoin("No game found with that code.");
  if (room.status !== "lobby") return renderJoin("This game has already started — ask the host for a new code.");

  roomCode = code;
  roomRef = candidateRoomRef;
  playersRef = roomRef.child("players");
  answersRef = roomRef.child("answers");
  reactionsRef = roomRef.child("reactions");
  myName = name;
  quizQuestions = Array.isArray(room.questions) ? room.questions : [];
  quizSeconds = room.questionSeconds || 20;
  streak = 0;

  await playersRef.child(playerId).set({
    name: myName,
    score: 0,
    joinedAt: firebase.database.ServerValue.TIMESTAMP,
  });
  playersRef.child(playerId).onDisconnect().remove();

  listenToRoom();
}

/* ---------- Live room listener ---------- */

function listenToRoom() {
  roomRef.on("value", (snap) => {
    const room = snap.val();
    if (!room) return;
    if (Array.isArray(room.questions) && room.questions.length) quizQuestions = room.questions;
    if (room.questionSeconds) quizSeconds = room.questionSeconds;

    // Self-paced: the room only signals lobby -> running -> final. Each player
    // drives their own way through the questions once the host starts; the host
    // never advances anyone, and nobody waits on anyone else.
    if (room.status === "lobby") {
      if (lastRenderedKey !== "lobby") { lastRenderedKey = "lobby"; renderWaiting(); }
    } else if (room.status === "running") {
      if (!selfStarted) {
        selfStarted = true;
        lastRenderedKey = "running";
        // Keep final scores from being wiped when a finisher closes their tab.
        playersRef.child(playerId).onDisconnect().cancel();
        startSelfPaced();
      }
    } else if (room.status === "final") {
      if (lastRenderedKey !== "final") {
        lastRenderedKey = "final";
        playersRef.child(playerId).onDisconnect().cancel();
        renderFinal();
      }
    }
  });

  playersRef.child(playerId).child("score").on("value", (snap) => {
    myScore = snap.val() || 0;
    const scoreEl = document.getElementById("myScoreReadout");
    if (scoreEl) scoreEl.textContent = myScore;
  });

  // The host may spin a last-place dare after the final screen is already
  // showing — this listener updates the banner live without a full re-render.
  roomRef.child("dare").on("value", (snap) => {
    const dare = snap.val();
    if (dare) showDareBanner(dare);
  });
}

function renderWaiting() {
  clearInterval(localTimer);
  footnote.textContent = "Room " + roomCode + " · Lobby";
  card.innerHTML = `
    <div class="center-msg">
      <span class="big-emoji">🎮</span>
      You're in, <strong>${esc(myName)}</strong>!<br>Waiting for the host to start the game…
    </div>
  `;
  animateCardIn();
}

/* ---------- Self-paced run ---------- */

function startSelfPaced() {
  myQ = 0;
  streak = 0;
  finishedSelf = false;
  showMyQuestion();
}

// Render whichever question this player is currently on, or finish.
function showMyQuestion() {
  if (!quizQuestions.length) return; // questions not synced yet; snapshot will retry
  if (myQ >= quizQuestions.length) { finishSelf(); return; }
  hasAnsweredThisQ = false;
  feedbackShown = false;
  qStartedAtLocal = Date.now();
  // Publish progress so the host dashboard can show where everyone is.
  playersRef.child(playerId).update({ progress: myQ });
  renderQuestion(myQ, qStartedAtLocal);
}

function advanceSelf() {
  clearInterval(feedbackTimer);
  stopFeedbackListeners();
  if (myLiveRank != null) myPrevRank = myLiveRank; // settle rank for next question's delta
  myQ += 1;
  showMyQuestion();
}

// This player answered their last question — mark done and wait for the rest.
function finishSelf() {
  finishedSelf = true;
  clearInterval(localTimer);
  clearInterval(feedbackTimer);
  playersRef.child(playerId).update({ progress: quizQuestions.length, finishedAt: firebase.database.ServerValue.TIMESTAMP });
  footnote.textContent = `Room ${roomCode} · Finished`;
  card.innerHTML = `
    <div class="reaction-stage" id="reactionStage"></div>
    <div class="feedback-hero is-correct">
      <div class="glyph-big">🏁</div>
      <p class="fh-title">All done!</p>
      <p class="fh-sub">You scored <strong>${myScore}</strong>. Hang tight while the rest finish.</p>
    </div>
    <span class="player-count-label standings-label">Live standings</span>
    <div id="miniBoard"></div>
    <div class="reaction-bar" id="reactionBar">
      <button class="reaction-btn" data-emoji="🔥" type="button" aria-label="React fire">🔥</button>
      <button class="reaction-btn" data-emoji="😅" type="button" aria-label="React nervous">😅</button>
      <button class="reaction-btn" data-emoji="🤔" type="button" aria-label="React thinking">🤔</button>
    </div>
  `;
  animateCardIn();
  wireReactions();
  // Keep the standings board live on the finish screen too.
  if (scoresListenerRef) scoresListenerRef.off();
  scoresListenerRef = playersRef;
  scoresListenerRef.on("value", (snap) => {
    const players = snap.val() || {};
    const list = Object.entries(players)
      .map(([id, p]) => ({ id, name: p.name || "Player", score: p.score || 0 }))
      .sort((a, b) => b.score - a.score);
    renderMiniBoard(list);
  });
}

/* ---------- Question screen ---------- */

function renderQuestion(idx, startedAt) {
  clearInterval(localTimer);
  clearInterval(feedbackTimer);
  stopFeedbackListeners();
  const item = quizQuestions[idx];
  const total = quizQuestions.length;
  if (!item) return; // questions haven't synced yet — next snapshot will retry
  footnote.textContent = `Room ${roomCode} · Question ${idx + 1} of ${total}`;

  card.innerHTML = `
    <div class="q-header">
      <span class="q-progress-label">QUESTION ${idx + 1} OF ${total}</span>
      <div class="timer-ring-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="timer-ring-track" cx="32" cy="32" r="27"></circle>
          <circle class="timer-ring-fill" id="ringFill" cx="32" cy="32" r="27"
            stroke-dasharray="${2 * Math.PI * 27}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-ring-num" id="ringNum">${quizSeconds}</div>
      </div>
    </div>
    <p class="question-text">${esc(item.q)}</p>
    ${item.img ? `<img class="q-img" src="${esc(item.img)}" alt="">` : ""}
    <div class="shape-grid" id="shapeGrid">
      ${item.options.map((opt, i) => `
        <button class="shape-btn ${SHAPES[i].cls}" data-i="${i}">
          <span class="glyph">${SHAPES[i].glyph}</span>
          <span>${esc(opt)}</span>
        </button>
      `).join("")}
    </div>
    <p class="hint" id="statusLine" style="text-align:center;margin-top:16px;">Tap your answer before time runs out.</p>
  `;
  animateCardIn();

  const buttons = Array.from(document.querySelectorAll(".shape-btn"));
  if (window.anime) {
    anime({ targets: buttons, opacity: [0, 1], translateY: [14, 0], delay: anime.stagger(70), duration: 380, easing: "easeOutQuad" });
  }
  buttons.forEach((btn) => {
    btn.addEventListener("click", () => submitAnswer(idx, parseInt(btn.dataset.i, 10), startedAt, buttons, btn));
  });

  const circumference = 2 * Math.PI * 27;
  const ringFill = document.getElementById("ringFill");
  const ringNum = document.getElementById("ringNum");
  let lastPulseSecond = null;

  localTimer = setInterval(() => {
    const elapsed = (Date.now() - startedAt) / 1000;
    const remaining = Math.max(0, quizSeconds - elapsed);
    const ratio = remaining / quizSeconds;
    if (ringFill) {
      ringFill.setAttribute("stroke-dashoffset", String(circumference * (1 - ratio)));
      ringFill.style.stroke = remaining <= 5 ? "var(--wrong)" : "var(--mint)";
    }
    const secondsLeft = Math.ceil(remaining);
    if (ringNum) ringNum.textContent = secondsLeft;
    if (remaining <= 5 && remaining > 0 && secondsLeft !== lastPulseSecond) {
      lastPulseSecond = secondsLeft;
      if (!hasAnsweredThisQ) playBeep();
      if (window.anime) anime({ targets: "#ringNum", scale: [1, 1.3, 1], duration: 420, easing: "easeInOutSine" });
    }
    if (remaining <= 0) {
      clearInterval(localTimer);
      if (!hasAnsweredThisQ) lockInTimeout(idx, buttons);
    }
  }, 200);
}

function submitAnswer(idx, choice, startedAt, buttons, chosenBtn) {
  if (hasAnsweredThisQ) return;
  hasAnsweredThisQ = true;
  clearInterval(localTimer);

  const item = quizQuestions[idx];
  const correct = choice === item.answer;
  const elapsedMs = Date.now() - startedAt;
  const remainingRatio = Math.max(0, Math.min(1, 1 - elapsedMs / (quizSeconds * 1000)));
  let points = correct ? Math.round(500 + 500 * remainingRatio) : 0;
  streak = correct ? streak + 1 : 0;
  const streakBonus = correct && streak >= 3 ? 100 : 0; // reward hot streaks
  points += streakBonus;

  buttons.forEach((b) => { b.disabled = true; if (b !== chosenBtn) b.classList.add("dimmed"); });
  if (window.anime) {
    anime({ targets: chosenBtn, scale: [1, 1.06, 1], duration: 260, easing: "easeOutQuad" });
  }
  const statusLine = document.getElementById("statusLine");
  if (statusLine) statusLine.textContent = "Locked in!";

  answersRef.child(idx).child(playerId).set({
    choice,
    correct,
    points,
    answeredAt: firebase.database.ServerValue.TIMESTAMP,
  });
  playersRef.child(playerId).child("score").transaction((cur) => (cur || 0) + points);

  // Don't leave the player sitting on a blank "waiting" screen for the rest
  // of the timer — they already know their own result the moment they tap,
  // since the correct answer ships to every client up front with the room's
  // question data. A short pause just lets the tap animation above finish
  // before the screen swaps to the result.
  setTimeout(() => paintFeedback(idx, { choice, correct, points, streakBonus }), 350);
}

function lockInTimeout(idx, buttons) {
  hasAnsweredThisQ = true;
  streak = 0;
  buttons.forEach((b) => { b.disabled = true; b.classList.add("dimmed"); });
  answersRef.child(idx).child(playerId).set({
    choice: null,
    correct: false,
    points: 0,
    answeredAt: firebase.database.ServerValue.TIMESTAMP,
  });
  paintFeedback(idx, { choice: null, correct: false, points: 0 });
}

/* ---------- Feedback (reveal) screen ---------- */

// Renders the correct/incorrect hero screen from an answer record we
// already have in hand — called immediately from submitAnswer/lockInTimeout
// so the player never has to wait on the host to find out how they did.
function paintFeedback(idx, mine) {
  if (feedbackShown) return;
  feedbackShown = true;
  clearInterval(localTimer);
  footnote.textContent = `Room ${roomCode} · Question ${idx + 1} answered`;
  const item = quizQuestions[idx];
  const correct = !!(mine && mine.correct);
  const points = mine ? mine.points : 0;
  const bonus = mine && mine.streakBonus ? mine.streakBonus : 0;
  const streakBadge = bonus
    ? `<div class="streak-badge bonus">🔥 ${streak} streak · +${bonus} bonus!</div>`
    : (correct && streak >= 2 ? `<div class="streak-badge">🔥 ${streak} in a row!</div>` : "");

  card.innerHTML = `
    <div class="reaction-stage" id="reactionStage"></div>
    <div class="feedback-hero ${correct ? "is-correct" : "is-wrong"}">
      <div class="glyph-big" id="feedbackGlyph">${correct ? "✓" : "✕"}</div>
      <p class="fh-title">${correct ? "Correct!" : (mine && mine.choice === null ? "Time's up" : "Not quite")}</p>
      <p class="fh-sub">${esc(item.options[item.answer])}</p>
      <p class="fh-points">${correct ? "+" + points + " points" : "+0 points"}</p>
      ${streakBadge}
      <div id="rankDelta"></div>
    </div>
    <div class="q-header" style="justify-content:center;">
      <span class="player-count-label">Your total score: <span id="myScoreReadout">${myScore}</span></span>
    </div>
    <p class="hint" id="qCountdown" style="text-align:center;font-weight:800;"></p>

    <span class="player-count-label standings-label">Live standings</span>
    <div id="miniBoard"></div>

    <div class="reaction-bar" id="reactionBar">
      <button class="reaction-btn" data-emoji="🔥" type="button" aria-label="React fire">🔥</button>
      <button class="reaction-btn" data-emoji="😅" type="button" aria-label="React nervous">😅</button>
      <button class="reaction-btn" data-emoji="🤔" type="button" aria-label="React thinking">🤔</button>
    </div>
  `;
  animateCardIn();
  wireReactions();
  if (correct) playCorrect(); else playWrong();
  startFeedbackLive(idx);
  if (window.anime) {
    anime({
      targets: "#feedbackGlyph",
      scale: [0, 1],
      rotate: correct ? [-12, 0] : [10, -6, 0],
      duration: 520,
      easing: "easeOutBack",
    });
    if (streakBadge) {
      anime({ targets: ".streak-badge", scale: [0, 1], opacity: [0, 1], duration: 420, delay: 200, easing: "easeOutBack" });
    }
  }
}

// Detach every feedback-screen Firebase listener when leaving that screen.
function stopFeedbackListeners() {
  if (liveCountRef) { liveCountRef.off(); liveCountRef = null; }
  if (scoresListenerRef) { scoresListenerRef.off(); scoresListenerRef = null; }
  if (reactionsRef) reactionsRef.off("child_added");
}

// Live answer count + countdown to question end, shown after this player
// answered so they don't stare at a dead "waiting" screen.
function startFeedbackLive(idx) {
  const cdEl = () => document.getElementById("qCountdown");

  // Live standings + rank movement — driven by total scores, so it stays
  // meaningful even though everyone is on a different question now.
  if (scoresListenerRef) scoresListenerRef.off();
  scoresListenerRef = playersRef;
  scoresListenerRef.on("value", (snap) => {
    const players = snap.val() || {};
    const list = Object.entries(players)
      .map(([id, p]) => ({ id, name: p.name || "Player", score: p.score || 0 }))
      .sort((a, b) => b.score - a.score);
    renderMiniBoard(list);
    renderRankDelta(list, idx);
  });

  // Self-advance: this player's own short pause before their next question.
  clearInterval(feedbackTimer);
  const endAt = Date.now() + SELF_FEEDBACK_SECONDS * 1000;
  const isLast = idx >= quizQuestions.length - 1;
  const tick = () => {
    const el = cdEl();
    const left = Math.ceil((endAt - Date.now()) / 1000);
    if (el) el.textContent = left > 0 ? `${isLast ? "Finishing" : "Next question"} in ${left}s` : "…";
    if (left <= 0) { clearInterval(feedbackTimer); advanceSelf(); }
  };
  tick();
  feedbackTimer = setInterval(tick, 200);
}

// Top 5 standings, my own row highlighted — reuses the final-screen table.
function renderMiniBoard(list) {
  const el = document.getElementById("miniBoard");
  if (!el) return;
  const top = list.slice(0, 5);
  const rankClass = (i) => (i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "");
  el.innerHTML = `
    <table class="leaderboard">
      <tbody>
        ${top.map((p, i) => `
          <tr class="${p.id === playerId ? "me" : ""}">
            <td><span class="rank ${rankClass(i)}">${i + 1}</span>${esc(p.name)}</td>
            <td>${p.score}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

// "Up to #3" / "Down to #7" / "Holding #4" vs where I stood last question.
function renderRankDelta(list, idx) {
  const el = document.getElementById("rankDelta");
  if (!el) return;
  const myIdx = list.findIndex((p) => p.id === playerId);
  if (myIdx < 0) return;
  const rank = myIdx + 1;
  let cls = "same", arrow = "＝", label = `Holding #${rank}`;
  if (myPrevRank == null) { label = `You're #${rank}`; }
  else if (rank < myPrevRank) { cls = "up"; arrow = "▲"; label = `Up to #${rank}`; }
  else if (rank > myPrevRank) { cls = "down"; arrow = "▼"; label = `Down to #${rank}`; }
  el.innerHTML = `<span class="rank-delta ${cls}"><span class="rd-arrow">${arrow}</span>${label}</span>`;
  myLiveRank = rank; // captured on advance so the next question compares against it
}

// Wire the emoji buttons + start listening for everyone's reactions.
function wireReactions() {
  const bar = document.getElementById("reactionBar");
  if (bar) {
    bar.querySelectorAll(".reaction-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!reactionsRef) return;
        reactionsRef.push({ emoji: btn.dataset.emoji, by: playerId, ts: firebase.database.ServerValue.TIMESTAMP });
        spawnEmoji(btn.dataset.emoji); // instant local feedback
      });
    });
  }
  // Only show reactions sent from now on, so joining mid-game doesn't replay old ones.
  if (reactionsRef) {
    reactionsRef.off("child_added");
    const since = Date.now();
    reactionsRef.orderByChild("ts").startAt(since).on("child_added", (snap) => {
      const r = snap.val();
      if (r && r.emoji && r.by !== playerId) spawnEmoji(r.emoji); // own reaction already shown locally
    });
  }
}

// ponytail: reactions are tiny + host clears the room at game end; no pruning.
function spawnEmoji(emoji) {
  const stage = document.getElementById("reactionStage");
  if (!stage) return;
  const span = document.createElement("span");
  span.className = "floating-emoji";
  span.textContent = emoji;
  span.style.left = (12 + Math.random() * 66) + "%";
  stage.appendChild(span);
  setTimeout(() => span.remove(), 2300);
}

// Fallback only — fires if the room reaches "reveal" before this client
// already painted its own result locally (e.g. a backgrounded tab throttled
// its local timer). Fetches from Firebase since there's no local answer
// to hand in that case; a no-op otherwise thanks to the feedbackShown guard.
async function renderFeedback(idx) {
  if (feedbackShown) return;
  let mine = null;
  try {
    const snap = await answersRef.child(idx).child(playerId).once("value");
    mine = snap.val();
  } catch (e) { /* ignore */ }
  paintFeedback(idx, mine);
}

/* ---------- Final screen ---------- */

async function renderFinal() {
  clearInterval(localTimer);
  clearInterval(feedbackTimer);
  stopFeedbackListeners();
  footnote.textContent = `Room ${roomCode} · Final results`;
  let list = [];
  try {
    const snap = await playersRef.once("value");
    const players = snap.val() || {};
    list = Object.entries(players)
      .map(([id, p]) => ({ id, name: p.name || "Player", score: p.score || 0 }))
      .sort((a, b) => b.score - a.score);
  } catch (e) { /* ignore */ }

  const myRank = list.findIndex((p) => p.id === playerId) + 1;
  const rankClass = (i) => (i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "");
  const podiumCount = Math.min(list.length, 3);
  const isChampion = myRank === 1;

  card.innerHTML = `
    <p class="eyebrow">Game Over</p>
    <div class="feedback-hero is-correct ${isChampion ? "champion" : ""}">
      <div class="glyph-big">🏆</div>
      <p class="fh-title">${isChampion ? "You're the Champion!" : "You finished #" + (myRank || "-")}</p>
      <p class="fh-sub">${myScore} points</p>
    </div>
    ${podiumHTML(list, playerId)}
    <h2>Final Leaderboard</h2>
    <table class="leaderboard">
      <thead><tr><th>Player</th><th>Score</th></tr></thead>
      <tbody>
        ${list.map((p, i) => `
          <tr class="${p.id === playerId ? "me" : ""}">
            <td><span class="rank ${rankClass(i)}">${i + 1}</span>${esc(p.name)}</td>
            <td>${p.score}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    <div id="dareBanner"></div>
    <button class="btn btn-ghost" style="margin-top:20px;width:100%;" onclick="location.reload()">Join Another Game</button>
  `;
  animateCardIn();
  animatePodium(podiumCount);
  if (window.anime) {
    anime({ targets: "table.leaderboard tbody tr", opacity: [0, 1], translateX: [-16, 0], delay: anime.stagger(55), duration: 380, easing: "easeOutQuad" });
    if (isChampion) {
      anime({ targets: ".feedback-hero .glyph-big", scale: [0.6, 1.12, 1], rotate: [-10, 8, 0], duration: 650, easing: "easeOutElastic(1, .6)" });
    }
  }
  if (myRank && myRank <= 3) setTimeout(launchConfetti, podiumConfettiDelay(podiumCount));
}

function showDareBanner(dare) {
  const banner = document.getElementById("dareBanner");
  if (!banner) return; // not on the final screen right now
  banner.innerHTML = `
    <div class="dare-card" id="dareCard">
      <p class="dc-eyebrow">🎯 Last-Place Dare</p>
      <p class="dc-target">${esc(dare.targetName)}, this one's for you…</p>
      <p class="dc-text">${esc(dare.text)}</p>
    </div>
  `;
  if (window.anime) {
    anime({ targets: "#dareCard", opacity: [0, 1], scale: [0.85, 1], duration: 450, easing: "easeOutElastic(1, .6)" });
  }
}

function launchConfetti() {
  const colors = ["#FF6B57", "#F2C94C", "#7B61FF", "#02C39A", "#028090"];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = 2.5 + Math.random() * 1.8 + "s";
    el.style.animationDelay = Math.random() * 0.6 + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5200);
  }
}

renderJoin();
</script>
